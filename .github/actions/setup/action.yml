name: Setup
description: Node 26 with the npm cache, the UI5 framework cache and the dependencies installed.

inputs:
    ui5-cache:
        description: Prefix of the UI5 framework cache key, one per set of UI5 versions a job loads.
        required: true

runs:
    using: composite
    steps:
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version: 26
              cache: npm

        - name: Cache UI5 framework resources
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.ui5
              key: ${{ inputs.ui5-cache }}-${{ hashFiles('packages/*/ui5*.yaml', 'package.json') }}
              restore-keys: ${{ inputs.ui5-cache }}-

        - run: npm ci
          shell: bash
