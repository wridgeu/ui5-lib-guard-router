name: CI

on:
    pull_request:
        branches: [main]
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/setup
              with:
                  ui5-cache: ui5

            - name: Commitlint
              if: github.event_name == 'pull_request'
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

            - name: Check formatting
              run: npm run fmt:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Check test layout
              run: npm run check:layout

            - name: Check diagrams
              run: npm run check:diagrams

            - name: Test the lint plugins and scripts
              run: npm run test:tooling

            - name: Verify vendored OpenUI5 router files
              run: npm run verify:openui5-router-vendor

            - name: Pack check
              run: npm run pack:check

    tests:
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup
              with:
                  ui5-cache: ui5

            - name: Run browser tests
              run: npm test

    compatibility-ui5-120:
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup
              with:
                  ui5-cache: ui5-compat-120

            - name: Run OpenUI5 1.120 compatibility QUnit suite
              run: npm run test:qunit:compat:120

    flp:
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sapui5: "1.154"
                      script: test:e2e:flp
                    - sapui5: "1.151"
                      script: test:e2e:flp:151
        name: flp-sapui5-${{ matrix.sapui5 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup
              with:
                  ui5-cache: ui5-flp-${{ matrix.sapui5 }}

            - name: Run FLP preview tests on SAPUI5 ${{ matrix.sapui5 }}
              run: npm run ${{ matrix.script }}
