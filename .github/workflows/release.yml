name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            force-publish:
                description: "Force npm publish (bypass release_created check)"
                type: boolean
                default: false

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions: {}

jobs:
    release-please:
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs['packages/lib--release_created'] }}
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    ci:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    publish:
        needs: [release-please, ci]
        if: needs.release-please.outputs.release_created == 'true' || inputs.force-publish == true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            # Builds the library through prepublishOnly. Authenticates via GitHub OIDC (id-token: write); empty token prevents PAT override
            - run: NODE_AUTH_TOKEN="" npm publish -w packages/lib --provenance --access public
