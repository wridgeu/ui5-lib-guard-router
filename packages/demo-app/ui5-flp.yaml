specVersion: "4.0"
metadata:
    name: demo.app
type: application
framework:
    name: SAPUI5
    version: "1.154.0"
    libraries:
        - name: sap.m
        - name: sap.ui.core
        - name: sap.tnt
        - name: sap.ushell
        - name: themelib_sap_horizon
server:
    customMiddleware:
        - name: ui5-tooling-transpile-middleware
          afterMiddleware: compression
          configuration:
              transpileDependencies: true
        - name: ui5-middleware-livereload
          afterMiddleware: compression
        - name: fiori-tools-preview
          afterMiddleware: ui5-middleware-livereload
          configuration:
              flp:
                  path: /test/flp.html
                  theme: sap_horizon
                  libs: true
                  # The FLP sandbox of SAPUI5 1.151 and later (fioriSandboxAppConfig.json, generated by the preview).
                  useNewSandbox: true
                  # A second app for the keep-alive E2E test (test/flp/flp-keep-alive.e2e.ts).
                  apps:
                      - target: /peer
                        local: test/flp/peer
                        intent:
                            object: peer
                            action: display
                      # The same app with the native and with the guard router (test/flp/flp-native-parity.e2e.ts).
                      - target: /parity/native
                        local: test/flp/parity/native
                        intent:
                            object: paritynative
                            action: display
                      - target: /parity/guard
                        local: test/flp/parity/guard
                        intent:
                            object: parityguard
                            action: display
                      # A launchpad page of its own that runs the demo app in an iframe (test/flp/flp-iframe-keep-alive.e2e.ts).
                      # The manifest has the type "component", so the preview adds no app for it and only serves the folder.
                      - target: /iframe
                        local: test/flp/iframe
resources:
    configuration:
        paths:
            webapp: webapp
        propertiesFileSourceEncoding: UTF-8
builder:
    customTasks:
        - name: ui5-tooling-transpile-task
          afterTask: replaceVersion
