# The server of the end-to-end tests: ui5.yaml without ui5-middleware-livereload. That middleware puts
# a script into every HTML page it serves, which reloads the page when a file of the demo app or
# of the library changes on disk: an edit during a test run reloads the page under test.
specVersion: "4.0"
metadata:
    name: demo.app
type: application
framework:
    name: OpenUI5
    version: "1.144.0"
    libraries:
        - name: sap.m
        - name: sap.ui.core
        - name: themelib_sap_horizon
server:
    customMiddleware:
        - name: ui5-tooling-transpile-middleware
          afterMiddleware: compression
          configuration:
              transpileDependencies: true
resources:
    configuration:
        paths:
            webapp: webapp
        propertiesFileSourceEncoding: UTF-8
builder:
    customTasks:
        - name: ui5-tooling-transpile-task
          afterTask: replaceVersion
