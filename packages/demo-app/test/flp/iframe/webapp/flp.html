<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Launchpad with the demo app in an iframe</title>
		<!--
			A launchpad whose site (site.json) runs the demo app in an iframe, for
			flp-iframe-keep-alive.e2e.ts. The preview middleware of the demo (fiori-tools-preview)
			writes every app of its own site as a component embedded in the launchpad page.
		-->
		<script src="config.js"></script>
		<script
			id="sap-ui-bootstrap"
			src="../resources/sap-ui-core.js"
			data-sap-ui-libs="sap.m,sap.ushell"
			data-sap-ui-async="true"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-compatVersion="edge"
			data-sap-ui-language="en"
			data-sap-ui-frameOptions="allow"
			data-sap-ui-resourceroots='{ "demo.iframe": "./" }'
			data-sap-ui-oninit="module:demo/iframe/init"
		></script>
	</head>
	<body class="sapUiBody" id="content"></body>
</html>
