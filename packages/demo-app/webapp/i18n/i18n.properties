# Root component of the guard router demo (demo.app)
# Text types: XTIT title, XBUT button, XFLD label, XCKL checkbox, XMSG status or placeholder text, YMSG long text, YDES description

#~~~ App descriptor ~~~

#XTIT: Application title, also the title of the FLP tile; index.html repeats it in its <title>
appTitle=UI5 Guard Router Demo
#YDES: Application description
appDescription=Demo of ui5.guard.router.Router: enter, leave and redirect guards, standalone and in the FLP preview

#~~~ Home ~~~

#XTIT: Title of the Home page
homeTitle=Home
#YMSG: Introduction on the Home page
homeIntro=Compare router navigation, direct hash changes, and FLP preview state. Protected uses an async enter guard and a dirty-form leave guard.

#XTIT: Panel with login state and runtime information
sessionPanelTitle=Session & Runtime
#YMSG: Explanation of the session and runtime panel
sessionPanelInfo=Switch auth state and inspect the active hash, launch mode, and FLP availability while you navigate.
#XFLD: Label of the login state
authLabel=Auth
#XMSG: Login state
authLoggedIn=Logged In
#XMSG: Login state
authLoggedOut=Logged Out
#XBUT: Log in
login=Login
#XBUT: Log out
logout=Logout
#XFLD: Label of the launch mode (standalone or FLP preview)
launchModeLabel=Launch Mode
#XMSG: Launch mode: the app runs in the FLP sandbox preview
launchModeFlp=FLP Preview
#XMSG: Launch mode: the app runs from index.html
launchModeStandalone=Standalone
#XFLD: Label of the current URL hash
currentHashLabel=Current Hash
#XMSG: Shown in place of a hash when the hash is empty
emptyHash=(empty hash)
#XFLD: Label of the last action the user triggered
lastActionLabel=Last Action
#XMSG: Last action before the user triggered one
actionReady=Ready
#XMSG: sap.ushell.Container is a technical name
ushellAvailable=sap.ushell.Container available
#XMSG: sap.ushell.Container is a technical name
ushellUnavailable=sap.ushell.Container unavailable
#XMSG: State of the FLP dirty-state provider
flpDirtyProviderActive=FLP cross-app dirty protection active
#XMSG: State of the FLP dirty-state provider
flpDirtyProviderInactive=FLP cross-app dirty protection inactive

#XTIT: Panel with buttons that navigate through the router
routerPanelTitle=Router Navigation
#YMSG: Explanation of the router navigation panel; router.navTo(...) is code
routerPanelInfo=These buttons call router.navTo(...). Use them to compare allowed navigation, enter blocks, redirects, and leave-guard behavior.
#XBUT
navProtected=Go to Protected Page
#YMSG: "Committed" is the settlement status shown in the settlement panel
navProtectedHint=When logged in, this navigation settles as Committed.
#XBUT
navBlocked=Go to Blocked Page (always blocks)
#XBUT
navForbidden=Go to Forbidden Page (always redirects home)
#XBUT: admin and protected are route names
navAdmin=Go to Admin Page (chain: admin → protected)
#XBUT
navEmployees=Employees (metadata)
#XBUT: "staff" is a route name
navTeam=Team (retired: redirects to alias "staff")
#XBUT
navReports=Reports (nested component)

#XTIT: Panel with buttons that navigate by changing the hash
hashPanelTitle=Hash-Based Scenarios
#YMSG: Explanation of the hash scenario panel
hashPanelInfo=These demo-only helpers drive navigation through the UI5 hash APIs to show deep links, blocked and redirected route hashes, missing routes, and rapid hash updates.
#XBUT
hashProtected=Set Hash to Protected
#XBUT
hashBlocked=Set Hash to Blocked
#XBUT
hashForbidden=Set Hash to Forbidden
#XBUT
hashMissing=Set Hash to Missing Route
#XBUT
rapidHash=Run Rapid Hash Sequence

#~~~ Last action (resolved in ScenarioRunner, shown under "Last Action") ~~~

#XMSG
actionLoggedIn=User logged in
#XMSG
actionLoggedOut=User logged out
#XMSG: {0} is a route name; router.navTo is code
actionNavTo=Triggered router.navTo("{0}")
#XMSG: {0} is a route name
actionHashTo=Triggered direct hash navigation to "{0}"
#XMSG
actionHashMissing=Triggered direct hash navigation to a nonexistent route
#XMSG: {0} is a sequence of route names, for example protected -> forbidden -> protected
actionRapidHash=Triggered rapid hash sequence: {0}
#XMSG
actionClearedDirty=Cleared dirty state and returned to Home

#~~~ Settlement panel (fragment) ~~~

#XFLD: Label of the result of the last navigation; also a panel title on the Not Found page
settlementLabel=Last Settlement
#XMSG: Shown in place of a settlement status before the first navigation settled
settlementNotSettled=Not settled yet
#XFLD: Label of the route name the navigation settled on
settlementRouteLabel=Route
#XMSG: Shown in place of a route name before the first navigation settled
settlementRoutePending=(pending)
#XMSG: Shown in place of a route name when no route matched the hash
settlementRouteNoMatch=(no match)
#XFLD: Label of the hash the navigation settled on
settlementHashLabel=Hash
#XMSG: {0} is the hash as a quoted string, for example "protected"
settlementHashTechnical=Technical: {0}

#~~~ Protected ~~~

#XTIT: Title of the Protected page
protectedTitle=Protected Page
#YMSG
protectedSuccess=You are viewing a protected page. This is only visible when logged in.
#YMSG
protectedInfo=If you see this page, the async enter guard allowed the navigation. Use the panels below to inspect leave-guard and FLP cross-app behavior.
#XTIT: Panel that demonstrates the leave guard
dirtyPanelTitle=Dirty Form Guard
#YMSG: beforeLeave is a technical name
dirtyPanelInfo=This route registers a beforeLeave guard. While the form is dirty, in-app navigation stays on this page and the previous hash is restored.
#XCKL
dirtyCheckbox=Simulate unsaved changes (dirty form)
#XMSG
formDirty=Form has unsaved changes
#XMSG
formClean=Form is clean
#XBUT
clearDirtyAndGoHome=Clear Dirty State and Return Home
#XTIT: Panel with the FLP state
flpPanelTitle=FLP Preview State
#YMSG: sap.ushell is a technical name
flpPanelInfo=In FLP preview, the demo also registers a sap.ushell dirty-state provider for cross-app navigation. Standalone mode keeps this inactive.

