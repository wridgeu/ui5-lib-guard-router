blockedInfo=You should never see this page. The guard always blocks before navigation commits.
#XTIT: Title of the Forbidden page
forbiddenTitle=Forbidden Page
#YMSG
forbiddenInfo=You should never see this page. The guard always redirects away.
#XTIT: Title of the Admin page
adminTitle=Admin Page
#YMSG: Protected is the name of a page
adminInfo=You should never see this page. The guard always redirects to Protected, which checks authentication.

